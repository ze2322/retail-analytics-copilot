name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the test dependencies
        # The suite runs the template and RAG paths only, so the heavier
        # agent-framework and LLM packages are not needed here.
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn numpy

      - name: Run the tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check that every module compiles
        run: python -m compileall -q agent app.py run_agent_hybrid.py tests

      - name: Check for unresolved merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)' -- . ; then
            echo "::error::Unresolved merge conflict markers are committed"
            exit 1
          fi
